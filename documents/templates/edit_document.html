<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Document | TrustVault</title>
</head>
<body>
    <h1>Edit Document</h1>

    <form method="post">
        {% csrf_token %}

        <p>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ document.title }}"
                required
            >
        </p>

        <p>
            <label for="category">Category:</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ document.category }}"
                required
            >
        </p>

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{% url 'document_details' document.id %}">Cancel</a>
    </p>
</body>
</html>
